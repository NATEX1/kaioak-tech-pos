services:
  db:
    image: postgres:17-alpine
    container_name: compos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-compos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - compos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compos} -d ${POSTGRES_DB:-compos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  compos_postgres_data:
